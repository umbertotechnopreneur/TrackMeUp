version: 2

updates:
  - package-ecosystem: nuget
    directories:
      - /TrackMeUp
      - /TrackMeUp.Cli
      - /TrackMeUp.Cli.Tests
      - /TrackMeUp.Core
      - /TrackMeUp.Core.Tests
      - /TrackMeUp.Ocr
      - /TrackMeUp.Ocr.Tests
      - /TrackMeUp.Presentation
      - /TrackMeUp.Presentation.Tests
      - /TrackMeUp.Search
      - /TrackMeUp.Search.Tests
      - /TrackMeUp.Taskbar
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 5
    groups:
      dotnet-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /TrackMeUp.Reports.Web
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 5
    groups:
      reports-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "10:00"
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
