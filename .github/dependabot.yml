version: 2

updates:
  - package-ecosystem: nuget
    directories:
      - /WorkTrail
      - /WorkTrail.Cli
      - /WorkTrail.Cli.Tests
      - /WorkTrail.Core
      - /WorkTrail.Core.Tests
      - /WorkTrail.Ocr
      - /WorkTrail.Ocr.Tests
      - /WorkTrail.Presentation
      - /WorkTrail.Presentation.Tests
      - /WorkTrail.Search
      - /WorkTrail.Search.Tests
      - /WorkTrail.Taskbar
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 5
    groups:
      dotnet-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "10:00"
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
