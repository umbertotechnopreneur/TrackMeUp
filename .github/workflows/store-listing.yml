name: store-listing

on:
  push:
    branches:
      - main
    paths:
      - 'store/**'
      - 'scripts/TrackMeUp.ps1'
      - '.github/workflows/store-listing.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'store/**'
      - 'scripts/TrackMeUp.ps1'
      - '.github/workflows/store-listing.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: validate Store listing
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate listing source
        shell: pwsh
        run: .\scripts\TrackMeUp.ps1 -Action ValidateStoreListing -ListingPath .\store\listing.json
