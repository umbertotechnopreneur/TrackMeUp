name: Portable release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release source
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Match the version and require a main commit
        id: version
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Releases must come from a commit reachable from main.' }
          $version = (Get-Content TrackMeUp/build-version.json -Raw | ConvertFrom-Json).semVer
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid release version.' }
          if ($env:EVENT_NAME -eq 'push' -and ($env:REF_TYPE -ne 'tag' -or $env:REF_NAME -cne "v$version")) {
            throw 'The tag must exactly match the release version, such as v1.2.3.'
          }
          if ($env:EVENT_NAME -eq 'workflow_dispatch' -and $env:REF_NAME -ne 'main') {
            throw 'Run manual packaging rehearsals from main.'
          }
          "version=$version" >> $env:GITHUB_OUTPUT

  package:
    name: Package (${{ matrix.platform }})
    needs: verify
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, ARM64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.16.0
          cache: npm
          cache-dependency-path: TrackMeUp.Reports.Web/package-lock.json
      - name: Build report assets
        working-directory: TrackMeUp.Reports.Web
        run: |
          npm ci
          npm run build
      - name: Restore, test, publish, and archive
        shell: pwsh
        env:
          PLATFORM: ${{ matrix.platform }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          $runtime = if ($env:PLATFORM -eq 'x64') { 'win-x64' } else { 'win-arm64' }
          dotnet restore .\TrackMeUp.slnx -p:Configuration=Release-Unpackaged -p:Platform=$env:PLATFORM
          if ($LASTEXITCODE -ne 0) { throw 'Restore failed.' }
          if ($env:PLATFORM -eq 'x64') {
            dotnet test .\TrackMeUp.slnx --configuration Release-Unpackaged -p:Platform=x64 --no-restore -m:1
            if ($LASTEXITCODE -ne 0) { throw 'Tests failed.' }
          }
          $payload = "artifacts/release/$env:PLATFORM/payload"
          dotnet publish .\TrackMeUp\TrackMeUp.csproj --configuration Release-Unpackaged -p:Platform=$env:PLATFORM -p:RuntimeIdentifier=$runtime --self-contained true --no-restore -p:ContinuousIntegrationBuild=true --output $payload
          if ($LASTEXITCODE -ne 0) { throw 'Publish failed.' }
          $archive = "artifacts/release/TrackMeUp-$env:VERSION-$env:PLATFORM-portable-unsigned.zip"
          Compress-Archive -Path "$payload/*" -DestinationPath $archive
          (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() + "  " + (Split-Path -Leaf $archive) | Set-Content "$archive.sha256" -Encoding utf8NoBOM
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portable-${{ matrix.platform }}
          path: |
            artifacts/release/*.zip
            artifacts/release/*.sha256
          if-no-files-found: error
          retention-days: 14

  draft:
    name: Prepare release draft
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [verify, package]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: portable-*
          merge-multiple: true
          path: release
      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $files = @(Get-ChildItem release -File | ForEach-Object FullName)
          gh release create $env:RELEASE_TAG @files --verify-tag --draft --prerelease --title "TrackMeUp $env:RELEASE_TAG" --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'Draft creation failed. Existing releases are never overwritten.' }
