name: release packages

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version X.Y.Z (unsigned artifacts only; no public release)'
        required: true
        type: string

concurrency:
  group: release-${{ github.event.inputs.version || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: pwsh -NoProfile -File {0}

jobs:
  version:
    runs-on: windows-latest
    outputs:
      value: ${{ steps.version.outputs.value }}
    steps:
      - name: Validate the common package version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          RELEASE_REF: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:INPUT_VERSION
          if ($env:EVENT_NAME -eq 'push') {
            if (-not $env:RELEASE_REF.StartsWith('v', [StringComparison]::Ordinal)) { throw 'Expected a vX.Y.Z tag.' }
            $version = $env:RELEASE_REF.Substring(1)
          }
          if ($version -cnotmatch '^[1-9][0-9]{0,4}\.(0|[1-9][0-9]{0,4})\.(0|[1-9][0-9]{0,4})$' -or
              @($version.Split('.') | Where-Object { [int]$_ -gt 65535 }).Count -gt 0) {
            throw 'Version must be X.Y.Z with major 1..65535 and minor/patch 0..65535.'
          }
          "value=$version" >> $env:GITHUB_OUTPUT

  package:
    name: MSIX (${{ matrix.platform }})
    needs: version
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, ARM64]
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.value }}
      RELEASE_PLATFORM: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.16.0
          cache: npm
          cache-dependency-path: TrackMeUp.Reports.Web/package-lock.json

      - name: Test release safeguards
        if: matrix.platform == 'x64'
        run: ./scripts/Test-ReleasePackaging.ps1

      - name: Build unsigned MSIX
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/TrackMeUp.ps1 -Action PackageMsix -Platform $env:RELEASE_PLATFORM -ReleaseVersion $env:RELEASE_VERSION -Unsigned -PackageOutputPath "./artifacts/release-packages/$env:RELEASE_PLATFORM"

      - name: Bundle matching runtime dependencies and checksums
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/New-ReleaseArchive.ps1 -PackageDirectory "./artifacts/release-packages/$env:RELEASE_PLATFORM" -Version $env:RELEASE_VERSION -Platform $env:RELEASE_PLATFORM

      - name: Upload unsigned release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: TrackMeUp-${{ needs.version.outputs.value }}-${{ matrix.platform }}-unsigned
          path: |
            artifacts/releases/${{ needs.version.outputs.value }}/${{ matrix.platform }}/*.zip
            artifacts/releases/${{ needs.version.outputs.value }}/${{ matrix.platform }}/*.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  draft:
    name: Draft release (awaiting signing)
    if: github.event_name == 'push'
    needs: [version, package]
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_VERSION: ${{ needs.version.outputs.value }}
    steps:
      - name: Download both architectures
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: TrackMeUp-${{ needs.version.outputs.value }}-*-unsigned
          path: release-assets
          merge-multiple: true

      - name: Verify assets and create a draft only
        run: |
          $ErrorActionPreference = 'Stop'
          $assets = @()
          foreach ($platform in @('x64', 'ARM64')) {
            $file = "TrackMeUp-$env:RELEASE_VERSION-$platform-unsigned.zip"
            $path = Join-Path 'release-assets' $file
            $checksum = "$path.sha256"
            $expected = (Get-Content -LiteralPath $checksum -Raw).Trim()
            $actual = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash
            if ($expected -cne "$actual  $file") { throw "Archive checksum mismatch: $file" }
            $assets += @($path, $checksum)
          }
          $existing = gh release list --limit 1000 --json tagName,isDraft | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect existing releases.' }
          if (@($existing | Where-Object tagName -CEQ $env:RELEASE_TAG).Count -gt 0) {
            throw 'A release already exists for this tag. Review it manually; existing assets are never replaced.'
          }
          @"
          Preparation build for TrackMeUp $env:RELEASE_VERSION (x64 and ARM64).

          **Unsigned: not installable and not ready for public publication.**
          Each ZIP includes the matching Microsoft-signed Windows App Runtime and SHA-256 checksums.
          Application signing, regenerated hashes, and clean-machine installation checks remain required.
          This draft is created automatically; the workflow never publishes it.
          "@ | Set-Content -LiteralPath release-notes.md -Encoding utf8NoBOM
          gh release create $env:RELEASE_TAG @assets --verify-tag --draft --title "TrackMeUp $env:RELEASE_VERSION - awaiting signing" --notes-file release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed.' }
