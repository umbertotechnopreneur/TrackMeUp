name: build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  reports-web:
    name: reports web
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20.19.0
          cache: npm
          cache-dependency-path: TrackMeUp.Reports.Web/package-lock.json

      - name: Install and build reports web assets
        working-directory: TrackMeUp.Reports.Web
        run: |
          npm ci
          npm run build

      - name: Verify reports distribution is current
        shell: pwsh
        run: |
          git diff --exit-code --ignore-space-at-eol -- TrackMeUp.Reports.Web/dist
          if ($LASTEXITCODE -ne 0) {
            throw 'TrackMeUp.Reports.Web/dist is stale. Run npm ci and npm run build, then commit the generated distribution.'
          }

          $untracked = @(git ls-files --others --exclude-standard -- TrackMeUp.Reports.Web/dist)
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          if ($untracked.Count -ne 0) {
            $untracked | Write-Output
            throw 'TrackMeUp.Reports.Web/dist is stale. Run npm ci and npm run build, then commit the generated distribution.'
          }

  lint:
    name: lint
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Verify source license headers
        shell: pwsh
        run: .\scripts\Test-SourceLicenseHeaders.ps1

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - name: Restore and audit NuGet dependencies
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Filter *.csproj | ForEach-Object {
            dotnet restore $_.FullName -p:NuGetAudit=true -p:NuGetAuditMode=all -p:NuGetAuditLevel=low -p:WarningsAsErrors=NU1901%3BNU1902%3BNU1903%3BNU1904
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

      - name: Verify code formatting
        shell: pwsh
        run: |
          $env:Platform = 'x64'
          Get-ChildItem -Recurse -Filter *.csproj | ForEach-Object {
            dotnet format $_.FullName whitespace --verify-no-changes --no-restore
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

      - name: Test with code analyzers
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Filter *.Tests.csproj | ForEach-Object {
            dotnet test $_.FullName -p:Platform=x64 --no-restore -p:EnableNETAnalyzers=true -p:EnforceCodeStyleInBuild=true -p:TreatWarningsAsErrors=true
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

  build:
    name: release build (${{ matrix.platform }})
    needs: reports-web
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, ARM64, x86]
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - name: Restore Release solution
        run: dotnet restore .\TrackMeUp.slnx -p:Configuration=Release-Unpackaged -p:Platform=${{ matrix.platform }}

      - name: Build Release solution
        run: dotnet build .\TrackMeUp.slnx --configuration Release-Unpackaged -p:Platform=${{ matrix.platform }} --no-restore -p:ContinuousIntegrationBuild=true -p:EnableNETAnalyzers=true -p:EnforceCodeStyleInBuild=true -p:TreatWarningsAsErrors=true

      - name: Test Release solution
        if: matrix.platform == 'x64'
        run: dotnet test .\TrackMeUp.slnx --configuration Release-Unpackaged -p:Platform=x64 --no-build --no-restore
