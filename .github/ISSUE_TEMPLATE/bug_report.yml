name: Bug report
description: Report a reproducible TrackMeUp problem without sharing private activity data.
title: "[Bug]: "
labels:
  - bug
  - triage
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve TrackMeUp. Remove API keys, personal screenshots, private paths, window titles, and confidential activity data before submitting. Report vulnerabilities privately through the security policy.

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Use the About version, package version, or Git commit SHA.
      placeholder: 1.0.x or abc1234
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows version and architecture
      placeholder: Windows 11 24H2, x64
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Give the smallest sequence that reproduces the problem.
      placeholder: |
        1. Open ...
        2. Choose ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true

  - type: dropdown
    id: evidence
    attributes:
      label: Evidence source
      options:
        - Local unpackaged run
        - Locally installed package
        - Build or automated test
        - GitHub Actions
        - Documentation only
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted diagnostics
      description: Optional logs, screenshots, or stack traces with sensitive data removed.

  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I removed credentials and private or personal data.
          required: true
        - label: This is not a security vulnerability.
          required: true
        - label: I agree to follow the Code of Conduct.
          required: true
